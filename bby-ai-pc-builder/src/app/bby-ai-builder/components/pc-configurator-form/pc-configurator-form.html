<div class="form-column">
    <div class="header">
      <h1 class="title">Custom PC Builder</h1>
      <p class="description-text">Design your custom PC with our AI-powered builder. Get expert recommendations for your budget and needs.</p>
    </div>

    <form [formGroup]="state.configForm" (ngSubmit)="onSubmit()">
      <div class="form-sections">
        <div class="section">
          <h2 class="section-title">1. Define Your Budget</h2>
          <div class="budget-slider-container">
            <input type="range" min="500" max="5000" step="50" formControlName="budget" class="budget-slider">
            <div class="budget-value">${{ state.configForm.get('budget')?.value }}</div>
          </div>
          <div class="budget-labels">
            <span>$500</span>
            <span>$5000</span>
          </div>
        </div>

        <div class="section">
          <h2 class="section-title">2. Primary Use Case</h2>
          <div class="options-grid-3">
            <label for="gaming" class="radio-label" [class.selected]="state.configForm.get('useCase')?.value === 'gaming'">
              <input type="radio" id="gaming" value="gaming" formControlName="useCase" class="radio-input">
              <span class="radio-icon gaming-icon"></span>
              Gaming
            </label>
            <label for="productivity" class="radio-label" [class.selected]="state.configForm.get('useCase')?.value === 'productivity'">
              <input type="radio" id="productivity" value="productivity" formControlName="useCase" class="radio-input">
              <span class="radio-icon productivity-icon"></span>
              Productivity
            </label>
            <label for="content" class="radio-label" [class.selected]="state.configForm.get('useCase')?.value === 'content_creation'">
              <input type="radio" id="content" value="content_creation" formControlName="useCase" class="radio-input">
              <span class="radio-icon content-icon"></span>
              Content Creation
            </label>
          </div>
        </div>

        <div *ngIf="state.configForm.get('useCase')?.value === 'gaming'" class="section gaming-options">
          <h3 class="section-title">2a. Gaming Style</h3>
          <div class="options-grid-2">
            <label for="esports" class="radio-label" [class.selected]="state.configForm.get('gamingType')?.value === 'esports'">
              <input type="radio" id="esports" value="esports" formControlName="gamingType" class="radio-input">
              Esports
            </label>
            <label for="story" class="radio-label" [class.selected]="state.configForm.get('gamingType')?.value === 'story_aaa'">
              <input type="radio" id="story" value="story_aaa" formControlName="gamingType" class="radio-input">
              Story / AAA
            </label>
          </div>
        </div>

        <div class="section">
          <h2 class="section-title">3. Build Priority</h2>
          <div class="options-grid-2">
            <label for="optimized" class="radio-label" [class.selected]="state.configForm.get('priority')?.value === 'optimized'">
              <input type="radio" id="optimized" value="optimized" formControlName="priority" class="radio-input">
              Optimized
            </label>
            <label for="aesthetics" class="radio-label" [class.selected]="state.configForm.get('priority')?.value === 'aesthetics'">
              <input type="radio" id="aesthetics" value="aesthetics" formControlName="priority" class.radio-input">
              Aesthetics
            </label>
          </div>
        </div>
      </div>
      <div class="submit-section">
        <button type="submit" class="submit-button" [disabled]="(state.isLoading$ | async) || state.configForm.invalid">
            <span *ngIf="!(state.isLoading$ | async)">View Recommendations</span>
            <span *ngIf="state.isLoading$ | async" class="spinner"></span>
        </button>
      </div>
    </form>
  </div>
